<div class="contenedor-login">
    <div class="tarjeta-login">
        <h2>Iniciar Sesión</h2>
        <form [formGroup]="form" (ngSubmit)="login()" novalidate>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input id="username" formControlName="username" placeholder="Ingrese su usuario" autofocus />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" formControlName="password" placeholder="Ingrese su contraseña" />
            </div>
            <div class="acciones-login">
                <button type="submit" class="primary" [disabled]="form.invalid">
                    Ingresar
                </button>
            </div>
        </form>
    </div>
</div>
