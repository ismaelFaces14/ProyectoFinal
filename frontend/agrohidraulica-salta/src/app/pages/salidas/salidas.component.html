<div class="contenedor-salidas container">
    <div class="tarjeta">
        <div class="encabezado-flex">
            <h2>Historial de Salidas</h2>
        </div>

        <div class="contenedor-tabla table-responsive" *ngIf="salidas.length > 0; else sinDatos">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Notas</th>
                        <th class="texto-centro">Ítems</th>
                        <th class="texto-derecha">Total</th>
                        <th class="texto-centro">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let salida of salidas">
                        <td>{{ salida.output_date | date: 'dd/MM/yy HH:mm' }}</td>

                        <td class="columna-notas">{{ salida.notes || '—' }}</td>

                        <td class="texto-centro">{{ salida.cantidad_items }}</td>

                        <td class="texto-derecha font-weight-bold">
                            {{ salida.total | currency: 'ARS' }}
                        </td>

                        <td class="texto-centro">
                            <button type="button" class="secondary small"
                                [routerLink]="['/salidas/detalle', salida.id]">
                                Ver detalle
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <ng-template #sinDatos>
            <div class="mensaje-vacio">
                <p>No hay salidas registradas en el sistema.</p>
            </div>
        </ng-template>
    </div>
</div>
